<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница услуг</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f7f7f7;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
        }

        .title-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .title-section h1 {
            font-size: 16px;
            font-weight: 400;
            color: #666;
            margin-bottom: 8px;
        }

        .title-section p {
            font-size: 12px;
            color: #999;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 900px;
            width: 100%;
        }

        .card {
            height: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .card h2 {
            position: absolute;
            top: 20px;
            color: white;
            font-size: 14px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
            z-index: 2;
        }

        .card .icon {
            font-size: 55px;
            color: rgba(255, 255, 255, 0.9);
            z-index: 2;
        }

        .card-consultations {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1556761175-5973dc0f32e7?auto=format&fit=crop&w=600&q=80') center/cover;
        }

        .card-strategy {
            background-color: #ff6600;
        }

        .card-investment {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=600&q=80') center/cover;
        }

        .card-marketing {
            background-color: #99cc00;
        }

        .card-startups {
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1497215728101-856f4ea42174?auto=format&fit=crop&w=600&q=80') center/cover;
        }

        .card-anti-crisis {
            background-color: #00c3c3;
        }

        @media (max-width: 768px) {
            .main-content {
                padding: 40px 15px;
            }

            .grid-container {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .card {
                height: 180px;
            }
        }
    </style>
</head>
<body>

    <main class="main-content">
        <div class="title-section">
            <h1>sunt in culpa</h1>
            <p>Images from Freepik</p>
        </div>

        <div class="grid-container">
            <div class="card card-consultations">
                <h2>CONSULTATIONS</h2>
                <div class="icon">💰</div>
            </div>
            <div class="card card-strategy">
                <h2>STRATEGY</h2>
                <div class="icon">♞</div>
            </div>
            <div class="card card-investment">
                <h2>INVESTMENT</h2>
                <div class="icon">💲</div>
            </div>
            <div class="card card-marketing">
                <h2>MARKETING</h2>
                <div class="icon">📢</div>
            </div>
            <div class="card card-startups">
                <h2>STARTUPS</h2>
                <div class="icon">🚀</div>
            </div>
            <div class="card card-anti-crisis">
                <h2>ANTI-CRISIS</h2>
                <div class="icon">🏭</div>
            </div>
        </div>
    </main>

</body>
</html>
